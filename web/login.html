<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>deck · login</title>
  <link rel="manifest" href="/static/manifest.webmanifest">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-zinc-100 h-screen flex flex-wrap items-center justify-center gap-12 select-none">
  <!-- numpad -->
  <div class="grid grid-cols-3 gap-3 w-72">
    <button type="button" data-key="1" class="key bg-zinc-800 rounded-2xl py-5 text-2xl font-medium active:bg-zinc-700">1</button>
    <button type="button" data-key="2" class="key bg-zinc-800 rounded-2xl py-5 text-2xl font-medium active:bg-zinc-700">2</button>
    <button type="button" data-key="3" class="key bg-zinc-800 rounded-2xl py-5 text-2xl font-medium active:bg-zinc-700">3</button>
    <button type="button" data-key="4" class="key bg-zinc-800 rounded-2xl py-5 text-2xl font-medium active:bg-zinc-700">4</button>
    <button type="button" data-key="5" class="key bg-zinc-800 rounded-2xl py-5 text-2xl font-medium active:bg-zinc-700">5</button>
    <button type="button" data-key="6" class="key bg-zinc-800 rounded-2xl py-5 text-2xl font-medium active:bg-zinc-700">6</button>
    <button type="button" data-key="7" class="key bg-zinc-800 rounded-2xl py-5 text-2xl font-medium active:bg-zinc-700">7</button>
    <button type="button" data-key="8" class="key bg-zinc-800 rounded-2xl py-5 text-2xl font-medium active:bg-zinc-700">8</button>
    <button type="button" data-key="9" class="key bg-zinc-800 rounded-2xl py-5 text-2xl font-medium active:bg-zinc-700">9</button>
    <button type="button" data-key="C" class="key bg-zinc-800 rounded-2xl py-5 text-lg text-zinc-400 active:bg-zinc-700">C</button>
    <button type="button" data-key="0" class="key bg-zinc-800 rounded-2xl py-5 text-2xl font-medium active:bg-zinc-700">0</button>
    <button type="button" data-key="back" class="key bg-zinc-800 rounded-2xl py-5 text-2xl text-zinc-400 active:bg-zinc-700">⌫</button>
  </div>

  <!-- entry -->
  <div class="w-64 text-center space-y-6">
    <h1 class="text-lg tracking-widest text-zinc-400 uppercase">Hyprhand</h1>
    <div id="dots" class="h-9 flex items-center justify-center text-3xl tracking-[0.4em] text-zinc-300"></div>
    <button id="unlock" type="button" class="w-full bg-emerald-600 hover:bg-emerald-500 rounded-xl py-3 font-medium">Unlock</button>
    <p id="msg" class="text-red-400 text-sm h-5"></p>
  </div>

  <script>
    let pin = "";
    const dots = document.getElementById("dots");
    const msg = document.getElementById("msg");
    const MAX = 12;

    const render = () => { dots.textContent = pin ? "●".repeat(pin.length) : "·····"; };

    function press(k) {
      if (k === "C") pin = "";
      else if (k === "back") pin = pin.slice(0, -1);
      else if (pin.length < MAX) pin += k;
      render();
    }

    async function submit() {
      if (!pin) return;
      msg.textContent = "";
      try {
        const r = await fetch("/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({ pin }),
        });
        const j = await r.json().catch(() => ({}));
        if (r.ok && j.ok) { location.href = "/"; return; }
        msg.textContent = r.status === 429 ? (j.error || "Locked") : "Wrong PIN";
      } catch (e) {
        msg.textContent = "Network error";
      }
      pin = "";
      render();
    }

    document.querySelectorAll("[data-key]").forEach((b) => (b.onclick = () => press(b.dataset.key)));
    document.getElementById("unlock").onclick = submit;
    addEventListener("keydown", (e) => {
      if (e.key >= "0" && e.key <= "9") press(e.key);
      else if (e.key === "Backspace") press("back");
      else if (e.key === "Enter") submit();
    });
    render();
  </script>
</body>
</html>
